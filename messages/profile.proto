syntax = "proto3";
package profile;

// [DART-SIGNAL]
message RequestUserProfile {
}

// [DART-SIGNAL]
message UpdateUserProfile {
  string name = 1;
  string handle = 2;
  string bio = 3;
  string location = 4;
  bytes profile_image = 5;
}

// [RUST-SIGNAL]
message ProfileSignal {
  string name = 1;
  string handle = 2;
  string bio = 3;
  string location = 4;
  bytes profile_image = 5;
}

// [RUST-SIGNAL]
message ProfileListResponse {
  int64 count = 1;
  repeated ProfileSignal profiles = 2;
}

// [DART-SIGNAL]
message ProfileListRequestQuery {
  uint64 offset = 1;
  uint64 amount = 2;
}
