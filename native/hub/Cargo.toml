[package]
# Do not change the name of this crate.
name = "hub"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
# `lib` is required for non-library targets,
# such as tests and benchmarks.
# `cdylib` is for Linux, Android, Windows, and web.
# `staticlib` is for iOS and macOS.
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "spout-social"
path = "src/main.rs"
required-features = ["headless"]

[dependencies]
rinf = "7.1.0"
prost = "0.13.0"
tokio = { version = "1", features = ["rt", "macros", "time"] }
iroh = "0.32.0"
iroh-base = "0.32.0"
anyhow = "1.0.95"
iroh-blobs = { version = "0.32.0", features = ["rpc"] }
iroh-gossip = { version = "0.32.0", features = ["rpc"] }
iroh-docs = { version = "0.32.0", features = ["rpc"] }
futures = "0.3.31"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
quic-rpc = { version = "0.18.1" }
base64 = "0.22.1"
image = "0.25.5"
directories = "6.0.0"
sled = "0.34.7"
rand = "0.8.5"
chrono = "0.4.39"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tracing-appender = "0.2.3"
futures-lite = "2.6.0"
n0-future = "0.1.2"
bytes = { version = "1.10.0", features = ["serde"] }
blake3 = "1.5.5"
vodozemac = "0.9.0"

ratatui = { version = "0.29.0", optional = true }
crossterm = { version = "0.28.1", optional = true }
tui-logger = { version = "0.14.4", features = ["tracing", "tracing-subscriber", "tracing-support"], optional = true }
tracing-futures = { version = "0.2.5", features = ["tokio"] }

[features]
default = []
headless = ["ratatui", "crossterm", "tui-logger"]

# Uncomment below to target the web.
# tokio_with_wasm = { version = "0.7.2", features = ["rt", "macros"] }
# wasm-bindgen = "0.2.95"
