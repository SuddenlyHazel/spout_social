syntax = "proto3";
package profile;

// [DART-SIGNAL]
message RequestUserProfile {
}

// [DART-SIGNAL]
message UpdateUserProfile {
  string name = 1;
  string handle = 2;
  string bio = 3;
  string location = 4;
  string profile_image = 5;
}

// [RUST-SIGNAL]
message ProfileSignal {
  string name = 1;
  string handle = 2;
  string bio = 3;
  string location = 4;
  string profile_image = 5;
}


