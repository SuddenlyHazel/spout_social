[package]
name = "spout-core"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10.3"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
hkdf = "0.12.4"
hmac = "0.12.1"
rand = "0.9.1"
sha2 = "0.10.9"
spout-types = { version = "0.1.0", path = "../spout-types", features = ["serde"] }
subtle = "2.6.1"
thiserror = "2.0.12"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zeroize = "1.8.1"
